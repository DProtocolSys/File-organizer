name: Build executables

# Push a tag such as "v1.0.0" to build the apps and attach them to a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: FileOrganizer-windows.exe
            source: dist/FileOrganizer.exe
          - os: ubuntu-latest
            artifact: FileOrganizer-linux
            source: dist/FileOrganizer
          - os: macos-latest
            artifact: FileOrganizer-macos.zip
            source: dist/FileOrganizer.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[build]"
      - run: python scripts/build_executable.py
      - name: Package (Windows / Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: cp "${{ matrix.source }}" "${{ matrix.artifact }}"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "${{ matrix.source }}" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
